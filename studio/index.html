  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var phone = /iPhone|iPod|Windows Phone|IEMobile|BlackBerry|Opera Mini/i.test(ua) ||
        (/Android/i.test(ua) && /Mobile/i.test(ua));
      if (!phone) {
        var touch = (navigator.maxTouchPoints || 0) > 1;
        var shortSide = Math.min(screen.width || 0, screen.height || 0);
        var longSide = Math.max(screen.width || 0, screen.height || 0);
        phone = touch && shortSide > 0 && shortSide <= 500 && longSide <= 1000;
      }
      if (phone) document.documentElement.classList.add("is-phone");
    })();
    window.addEventListener("beforeinstallprompt", function (event) { event.preventDefault(); });
  </script>
