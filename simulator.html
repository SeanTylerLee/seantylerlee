<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8a9099" />
  <meta name="robots" content="index, follow" />
  <title>FleetDispatch simulator · STL Apps LLC</title>
  <meta name="description" content="Interactive FleetDispatch demo — switch roles and try dispatches, tickets, team, and shop boards." />
  <link rel="canonical" href="https://seantylerlee.com/simulator.html" />
  <link rel="icon" href="images/stlapps-layers.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/stlapps-layers.png" />
  <style>
    :root {
      --phone-w: 320px;
      --phone-h: 690px;
      --bezel: #1a1a1e;
      --bezel-edge: #0c0c0e;
      --bg: #f2f2f7;
      --card: #ffffff;
      --primary: #1c1c1e;
      --secondary: #8e8e93;
      --blue: #007aff;
      --orange: #ff9500;
      --green: #34c759;
      --red: #ff3b30;
      --purple: #af52de;
      --hairline: rgba(60, 60, 67, 0.12);
      --tab-h: 72px;
      --glass-border: rgba(255, 255, 255, 0.55);
      --glass-highlight: rgba(255, 255, 255, 0.75);
      --glass-text: #1c1e22;
      --glass-muted: #4a5058;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(ellipse 90% 55% at 50% -12%, rgba(255, 255, 255, 0.55), transparent 58%),
        radial-gradient(ellipse 50% 40% at 8% 85%, rgba(255, 255, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 45% 35% at 92% 70%, rgba(120, 130, 145, 0.2), transparent 50%),
        linear-gradient(165deg, #a8aeb6 0%, #9198a1 45%, #838a94 100%);
      overflow-x: hidden;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      color: var(--glass-text);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
      opacity: 0.55;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.28), transparent 42%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(60, 66, 76, 0.12), transparent 60%);
    }

    .sim-top,
    .sim-main {
      position: relative;
      z-index: 1;
    }

    .sim-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.58) 0%,
        rgba(255, 255, 255, 0.38) 100%
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 8px 28px rgba(40, 48, 60, 0.1);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
    }

    .sim-top a.brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      padding: 0.3rem 0.55rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 2px 10px rgba(40, 48, 60, 0.1);
    }

    .sim-top .brand-logo {
      height: 32px;
      width: auto;
      max-width: min(200px, 52vw);
      object-fit: contain;
      display: block;
    }

    .sim-top .back {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1c1e22;
      text-decoration: none;
      padding: 0.5rem 0.95rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .sim-top .back:hover {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.7);
      color: #000;
    }

    .sim-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem 2.5rem;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
      padding: 1.35rem 1.25rem 1.5rem;
      border-radius: 28px;
      background: linear-gradient(
        160deg,
        rgba(255, 255, 255, 0.48) 0%,
        rgba(255, 255, 255, 0.28) 55%,
        rgba(255, 255, 255, 0.22) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        0 20px 50px rgba(40, 48, 60, 0.14),
        0 4px 16px rgba(40, 48, 60, 0.08);
      backdrop-filter: blur(28px) saturate(1.15);
      -webkit-backdrop-filter: blur(28px) saturate(1.15);
    }

    .stage-label {
      text-align: center;
      max-width: 360px;
    }

    .stage-label h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.3rem;
      color: #15171a;
    }

    .stage-label p {
      font-size: 0.88rem;
      color: var(--glass-muted);
      line-height: 1.45;
      font-weight: 500;
    }

    .stage-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }

    .controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      max-width: min(360px, 100%);
      padding: 3px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        0 2px 8px rgba(40, 48, 60, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .role-chip {
      border: none;
      border-radius: 8px;
      padding: 0.38rem 0.62rem;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 560;
      letter-spacing: -0.01em;
      background: transparent;
      color: #3a4048;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
      text-align: center;
    }

    .role-chip:hover {
      color: #121416;
    }

    .role-chip.is-active {
      background: rgba(255, 255, 255, 0.92);
      color: #121416;
      box-shadow:
        0 1px 3px rgba(40, 48, 60, 0.12),
        0 0 0 0.5px rgba(40, 48, 60, 0.06);
      font-weight: 600;
    }

    .role-chip:active { transform: scale(0.98); }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-width: 0;
      padding: 0.55rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 980px;
      background: rgba(255, 255, 255, 0.45);
      color: #2a2e34;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 560;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 2px 8px rgba(40, 48, 60, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.72);
      color: #121416;
      border-color: rgba(255, 255, 255, 0.85);
    }

    .refresh-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.4);
    }

    .refresh-btn svg {
      width: 0.9rem;
      height: 0.9rem;
      opacity: 0.8;
    }

    /* —— iPhone shell —— */
    .iphone {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 48px;
      background: linear-gradient(145deg, #2a2a30 0%, var(--bezel) 40%, var(--bezel-edge) 100%);
      box-shadow:
        0 0 0 1px #3a3a42,
        0 0 0 3px #0a0a0c,
        0 10px 22px rgba(40, 48, 60, 0.2),
        0 28px 56px rgba(40, 48, 60, 0.22),
        0 48px 80px rgba(40, 48, 60, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      padding: 12px;
    }

    .iphone::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 48px;
      pointer-events: none;
      background: linear-gradient(105deg, rgba(255,255,255,0.08) 0%, transparent 18%, transparent 82%, rgba(255,255,255,0.04) 100%);
      z-index: 4;
    }

    .btn-silent, .btn-vol-up, .btn-vol-down, .btn-power {
      position: absolute;
      z-index: 5;
      background: linear-gradient(180deg, #3a3a40 0%, #222226 45%, #1a1a1e 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.35);
    }
    .btn-silent { left: -5px; top: 112px; width: 5px; height: 32px; border-radius: 3px 1px 1px 3px; }
    .btn-vol-up { left: -5px; top: 168px; width: 5px; height: 56px; border-radius: 3px 1px 1px 3px; }
    .btn-vol-down { left: -5px; top: 236px; width: 5px; height: 56px; border-radius: 3px 1px 1px 3px; }
    .btn-power { right: -5px; top: 188px; width: 5px; height: 80px; border-radius: 1px 3px 3px 1px; }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 38px;
      background: var(--bg);
      overflow: hidden;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 28px;
      background: #0a0a0c;
      border-radius: 20px;
      z-index: 20;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 14px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
      z-index: 15;
      pointer-events: none;
      color: var(--primary);
    }

    .status-bar .right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-bar svg { display: block; }

    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 4px;
      background: #0a0a0c;
      border-radius: 4px;
      z-index: 20;
      pointer-events: none;
      opacity: 0.85;
    }

    /* —— App chrome —— */
    .app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: 48px;
      background: var(--bg);
      position: relative;
    }

    .top-bar {
      flex-shrink: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--primary);
      background: var(--bg);
      position: relative;
      z-index: 2;
      padding: 0 10px;
    }

    .top-bar .nav-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(120, 120, 128, 0.16);
      color: var(--primary);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 6px 12px;
      border-radius: 980px;
      cursor: pointer;
      display: none;
      line-height: 1.15;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s ease, opacity 0.12s ease;
    }

    .top-bar .nav-btn:hover { background: rgba(120, 120, 128, 0.22); }
    .top-bar .nav-btn:active { opacity: 0.7; }

    .top-bar.has-back .nav-btn { display: block; }

    .top-bar .nav-btn-right {
      left: auto;
      right: 10px;
      display: none;
      color: var(--primary);
      background: rgba(120, 120, 128, 0.16);
      font-weight: 600;
    }

    .top-bar .nav-btn-right.is-emphasis {
      color: #fff;
      background: var(--blue);
    }

    .top-bar .nav-btn-right.is-emphasis:hover {
      background: #0066d6;
    }

    .top-bar.has-right .nav-btn-right { display: block; }

    .content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 4px 14px calc(var(--tab-h) + 18px);
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar { display: none; }

    /* —— Floating tab bar —— */
    .tabbar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      z-index: 12;
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 7px 5px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.1),
        0 2px 6px rgba(0, 0, 0, 0.05),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.9);
      border: 0.5px solid rgba(255, 255, 255, 0.6);
    }

    .tab {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px;
      font: inherit;
      cursor: pointer;
      border-radius: 20px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .tab.is-active {
      color: var(--blue);
      background: rgba(255,255,255,0.55);
    }

    .tab svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .tab span {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* —— Shared UI pieces —— */
    .hdr {
      margin-bottom: 14px;
      padding-top: 2px;
    }

    .hdr .co {
      font-size: 12px;
      font-weight: 500;
      color: var(--secondary);
      margin-bottom: 2px;
    }

    .hdr h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 3px;
    }

    .hdr .sub {
      font-size: 13px;
      color: var(--secondary);
      line-height: 1.3;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 13px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 96px;
      box-shadow: 0 0.5px 0 rgba(0, 0, 0, 0.02);
    }

    .stat .ico {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat .ico svg { width: 15px; height: 15px; }

    .stat .val {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .stat .ttl {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.15;
    }

    .stat .meta {
      font-size: 11px;
      color: var(--secondary);
      line-height: 1.2;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 2px 8px;
    }

    .section-head .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 0.5px 0 rgba(0, 0, 0, 0.02);
    }

    .card.pad { padding: 15px; }

    .card.outline-orange {
      box-shadow: inset 0 0 0 1px rgba(255, 149, 0, 0.35);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .row:active { background: rgba(0,0,0,0.04); }

    .row + .row,
    .list-row + .list-row {
      border-top: 0.5px solid var(--hairline);
    }

    .row .ico-blue {
      width: 26px;
      flex-shrink: 0;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row .ico-blue svg { width: 16px; height: 16px; }

    .row .body { flex: 1; min-width: 0; }

    .row .body .t {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
    }

    .row .body .s {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev {
      color: rgba(142,142,147,0.7);
      flex-shrink: 0;
    }

    .chev svg { width: 12px; height: 12px; display: block; }

    .list-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .list-row:active { background: rgba(0, 0, 0, 0.04); }

    .list-row .mark {
      width: 26px;
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 2px;
      display: flex;
      justify-content: center;
    }

    .list-row .mark svg { width: 15px; height: 15px; }

    .list-row .main { flex: 1; min-width: 0; }

    .list-row .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .list-row .top .name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }

    .list-row .top .status {
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .list-row .line {
      font-size: 12px;
      color: var(--secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-row .line.strong {
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 22px 16px;
      color: var(--secondary);
    }

    .empty svg {
      width: 28px;
      height: 28px;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .empty .t {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .empty .s { font-size: 12px; line-height: 1.35; }

    /* Accept / active cards */
    .job-card { margin-bottom: 14px; }

    .job-card .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .job-card .badge svg { width: 13px; height: 13px; }

    .job-card .load {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .job-card .cust {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .job-card .route {
      font-size: 13px;
      color: var(--secondary);
      margin-bottom: 2px;
    }

    .job-card .unit {
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;

    function nextLoadRef() {
      var nums = session.dispatches.map(function (d) {
        var m = String(d.loadReference).match(/\d+/);
        return m ? parseInt(m[0], 10) : 0;
      });
      var next = (nums.length ? Math.max.apply(null, nums) : 4820) + 1;
      return "Load #" + next;
    }

    /* —— Tabs per role —— */
    function tabsForRole() {
      switch (session.role) {
        case "owner":
          return [
            { id: "home", title: "Home", icon: "house" },
            { id: "dispatches", title: "Dispatches", icon: "list" },
            { id: "equipment", title: "Equipment", icon: "wrench" },
            { id: "team", title: "Team", icon: "people" },
            { id: "settings", title: "Settings", icon: "gear" }
          ];
        case "office":
          return [
            { id: "home", title: "Home", icon: "house" },
            { id: "tickets", title: "Tickets", icon: "doc" },
            { id: "settings", title: "Settings", icon: "gear" }
          ];
        case "dispatcher": {
          var t = [
            { id: "home", title: "Home", icon: "house" },
            { id: "dispatches", title: "Dispatches", icon: "clipboard" }
          ];
          if (canManageUsers()) t.push({ id: "team", title: "Team", icon: "people" });
          t.push({ id: "settings", title: "Settings", icon: "gear" });
          return t;
        }
        case "mechanic":
          return [
            { id: "home", title: "Home", icon: "house" },
            { id: "equipment", title: "Write-ups", icon: "wrench" },
            { id: "settings", title: "Settings", icon: "gear" }
          ];
        case "driver":
        default:
          return [
            { id: "home", title: "Home", icon: "house" },
            { id: "dispatches", title: "Dispatches", icon: "list" },
            { id: "settings", title: "Settings", icon: "gear" }
          ];
      }
    }

    function titleForScreen() {
      if (nav.sheet === "newDispatch") return "New dispatch";
      if (nav.sheet === "ticket") return "New ticket";
      if (nav.sheet === "addUser") return "Add user";
      if (nav.sheet === "writeup") return "Write-up";
      if (nav.screen === "dispatchDetail") return "Dispatch";
      if (nav.screen === "ticketDetail") return "Ticket";
      switch (nav.tab) {
        case "home":
          return ({ owner: "Owner", office: "Office", dispatcher: "Dispatcher", mechanic: "Mechanic", driver: "Driver" })[session.role] || "Home";
        case "dispatches": return "Dispatches";
        case "equipment": return session.role === "mechanic" ? "Write-ups" : "Equipment";
        case "team": return "Team";
        case "tickets": return "Tickets";
        case "settings": return "Settings";
        default: return "FleetDispatch";
      }
    }

    /* —— Render pieces —— */
    function statCard(opts) {
      return (
        '<div class="stat">' +
          '<div class="ico" style="color:' + opts.color + '">' + opts.icon + "</div>" +
          '<div class="val">' + esc(opts.value) + "</div>" +
          '<div class="ttl">' + esc(opts.title) + "</div>" +
          '<div class="meta">' + esc(opts.subtitle) + "</div>" +
        "</div>"
      );
    }

    function sectionHead(label, linkLabel, linkAction) {
      return (
        '<div class="section-head">' +
          '<span class="label">' + esc(label) + "</span>" +
          (linkLabel
            ? '<button type="button" class="link" data-action="' + esc(linkAction) + '">' + esc(linkLabel) + "</button>"
            : "") +
        "</div>"
      );
    }

    function actionRow(title, subtitle, iconHtml, action) {
      return (
        '<button type="button" class="row" data-action="' + esc(action) + '">' +
          '<span class="ico-blue">' + iconHtml + "</span>" +
          '<span class="body"><span class="t">' + esc(title) + '</span><span class="s">' + esc(subtitle) + "</span></span>" +
          '<span class="chev">' + I.chev + "</span>" +
        "</button>"
      );
    }

    function dispatchPreviewRow(job, showStatus) {
      var accent =
        job.status === "sent" ? "var(--orange)" :
        job.status === "accepted" ? "var(--green)" :
        job.status === "declined" ? "var(--red)" : "var(--secondary)";
      var mark =
        job.status === "accepted" ? I.check :
        job.status === "sent" ? I.plane : I.clipboard(true);

      return (
        '<button type="button" class="list-row" data-action="openDispatch" data-id="' + esc(job.id) + '">' +
          '<span class="mark" style="color:' + accent + '">' + mark + "</span>" +
          '<span class="main">' +
            '<span class="top">' +
              '<span class="name">' + esc(job.loadReference) + "</span>" +
              (showStatus
                ? '<span class="status" style="color:' + accent + '">' + esc(STATUS_TITLE[job.status]) + "</span>"
                : '<span class="chev" style="color:rgba(142,142,147,0.7)">' + I.chev + "</span>") +
            "</span>" +
            (showStatus
              ? '<span class="line strong">' + esc(job.customerName) + "</span>" +
                '<span class="line">' + esc(job.driverName) + " · " + esc(job.equipmentUnit) + "</span>" +
                '<span class="line">' + esc(job.origin) + " → " + esc(job.destination) + "</span>"
              : '<span class="line">' + esc(job.driverName) + " · " + esc(job.origin) + " → " + esc(job.destination) + "</span>") +
          "</span>" +
        "</button>"
      );
    }

    /* —— Role homes —— */
    function renderOwnerHome() {
      var openJobs = dispatchesPending().length + dispatchesActive().length;
      var awaiting = ticketsAwaiting().length;
      var shop = writeUpsNeedingShop().length;
      var dCount = drivers().length;

      return (
        '<div class="hdr"><div class="co">' + esc(session.companyName) + "</div>" +
          "<h2>Owner dashboard</h2>" +
          '<div class="sub">Company-wide view. Only your company’s data.</div></div>' +
        '<div class="grid-2">' +
          statCard({ title: "Dispatches", value: String(openJobs), subtitle: "Open jobs", icon: I.list(true), color: "var(--blue)" }) +
          statCard({ title: "Tickets", value: String(awaiting), subtitle: "Awaiting bill", icon: I.doc(true), color: "var(--orange)" }) +
          statCard({ title: "Write-ups", value: String(shop), subtitle: "Open for shop", icon: I.wrench(true), color: "var(--purple)" }) +
          statCard({ title: "Drivers", value: String(dCount), subtitle: "On your team", icon: I.wheel, color: "var(--green)" }) +
        "</div>" +
        sectionHead("Quick actions") +
        '<div class="card mb-14">' +
          actionRow("Manage team", "Add users and assign roles", I.people(true), "goTeam") +
          actionRow("Dispatches", "Company-wide jobs", I.list(true), "goDispatches") +
          actionRow("Equipment", "Fleet and write-ups", I.wrench(true), "goEquipment") +
          actionRow("Company settings", "Account and app info", I.gear(true), "goSettings") +
        "</div>"
      );
    }

    function renderOfficeHome() {
      var awaiting = ticketsAwaiting();
      var billed = ticketsBilled();
      var total = awaiting.reduce(function (s, t) { return s + t.rateAmount; }, 0);

      var rows = awaiting.slice(0, 3).map(function (t) {
        return (
          '<button type="button" class="list-row" data-action="openTicket" data-id="' + esc(t.id) + '">' +
            '<span class="mark c-orange">' + I.doc(true) + "</span>" +
            '<span class="main">' +
              '<span class="top"><span class="name">' + esc(t.number) + '</span><span class="amount">' + money(t.rateAmount) + "</span></span>" +
              '<span class="line">' + esc(t.customerName) + " · " + esc(t.driverName) + "</span>" +
            "</span>" +
          "</button>"
        );
      }).join("");

      return (
        '<div class="hdr"><div class="co">' + esc(session.companyName) + "</div>" +
          "<h2>Office dashboard</h2>" +
          '<div class="sub">Bill tickets drivers submit. Company data only.</div></div>' +
        '<div class="grid-2">' +
          statCard({ title: "Awaiting bill", value: String(awaiting.length), subtitle: money(total) + " total", icon: I.doc(true), color: "var(--orange)" }) +
          statCard({ title: "Billed", value: String(billed.length), subtitle: "This company", icon: I.check, color: "var(--green)" }) +
        "</div>" +
        sectionHead("Needs billing", awaiting.length ? "See all" : null, "goTickets") +
        '<div class="card mb-14">' +
          (rows || '<div class="empty"><div class="t">Queue clear</div><div class="s">No tickets waiting to bill.</div></div>') +
        "</div>" +
        sectionHead("Quick actions") +
        '<div class="card">' +
          actionRow("Ticket queue", awaiting.length + " ticket" + (awaiting.length === 1 ? "" : "s") + " ready to bill", I.doc(true), "goTickets") +
          actionRow("Settings", "Account and app info", I.gear(true), "goSettings") +
        "</div>"
      );
    }

    function renderDispatcherHome() {
      var pending = dispatchesPending();
      var active = dispatchesActive();
      var preview = pending.slice(0, 3).map(function (j) {
        return dispatchPreviewRow(j, false);
      }).join("");

      return (
        '<div class="hdr"><div class="co">' + esc(session.companyName) + "</div>" +
          "<h2>Dispatcher board</h2>" +
          '<div class="sub">Send jobs to drivers. Only this company’s loads.</div></div>' +
        '<div class="grid-2">' +
          statCard({ title: "Awaiting reply", value: String(pending.length), subtitle: "Sent to drivers", icon: I.plane, color: "var(--orange)" }) +
          statCard({ title: "Accepted", value: String(active.length), subtitle: "On the road", icon: I.check, color: "var(--green)" }) +
          statCard({ title: "Drivers", value: String(drivers().length), subtitle: "Available to assign", icon: I.wheel, color: "var(--blue)" }) +
          statCard({ title: "Today’s board", value: String(session.dispatches.length), subtitle: "All statuses", icon: I.clipboard(true), color: "var(--purple)" }) +
        "</div>" +
        sectionHead("Awaiting driver", pending.length ? "See all" : null, "goDispatches") +
        '<div class="card mb-14">' +
          (preview || '<div class="empty">' + I.plane + '<div class="t">No pending dispatches</div><div class="s">Send a new dispatch when you have a load.</div></div>') +
        "</div>" +
        sectionHead("Quick actions") +
        '<div class="card">' +
          actionRow(
            "Dispatches",
            pending.length ? pending.length + " waiting on driver reply" : "Create and track loads",
            I.clipboard(true),
            "goDispatches"
          ) +
          (canManageUsers()
            ? actionRow("Manage team", "Owner delegated user management", I.people(true), "goTeam")
            : "") +
          actionRow("Settings", "Account and app info", I.gear(true), "goSettings") +
        "</div>"
      );
    }

    function renderMechanicHome() {
      var open = writeUpsOpen();
      var prog = writeUpsInProgress();
      var pri = writeUpsPriority();
      var resolved = writeUpsResolved();
      var need = writeUpsNeedingShop();

      var rows = need.slice(0, 4).map(function (w) {
        var pColor =
          w.priority === "high" || w.priority === "outOfService" ? "var(--red)" :
          w.priority === "medium" ? "var(--orange)" : "var(--secondary)";
        return (
          '<button type="button" class="list-row" data-action="openWriteUp" data-id="' + esc(w.id) + '">' +
            '<span class="mark c-orange">' + I.wrench(true) + "</span>" +
            '<span class="main">' +
              '<span class="top"><span class="name">' + esc(w.title) + '</span><span class="status" style="color:' + pColor + '">' + esc(PRIORITY_TITLE[w.priority]) + "</span></span>" +
              '<span class="line">' + esc(w.equipmentUnit) + " · " + esc(w.driverName) + "</span>" +
            "</span>" +
          "</button>"
        );
      }).join("");

      return (
        '<div class="hdr"><div class="co">' + esc(session.companyName) + "</div>" +
          "<h2>Shop board</h2>" +
          '<div class="sub">Driver write-ups for your company’s equipment only.</div></div>' +
        '<div class="grid-2">' +
          statCard({ title: "Open", value: String(open.length), subtitle: "Not started", icon: I.wrench(true), color: "var(--orange)" }) +
          statCard({ title: "In progress", value: String(prog.length), subtitle: "On the floor", icon: I.hammer, color: "var(--purple)" }) +
          statCard({ title: "Priority", value: String(pri.length), subtitle: "High / OOS", icon: I.alert, color: "var(--red)" }) +
          statCard({ title: "Resolved", value: String(resolved.length), subtitle: "Fixed or closed", icon: I.check, color: "var(--green)" }) +
        "</div>" +
        sectionHead("Needs shop", need.length ? "See all" : null, "goEquipment") +
        '<div class="card mb-14">' + (rows || '<div class="empty"><div class="t">Shop is clear</div></div>') + "</div>"
      );
    }

    function renderDriverHome() {
      var driver = currentDriver();
      var pending = myPending()[0] || null;
      var active = myActive();
      var previous = myDispatches()
        .filter(function (j) { return j.status === "completed" || j.status === "declined"; })
        .slice(0, 3);

      var html =
        '<div class="hdr"><div class="co">' + esc(session.companyName) + "</div>" +
        "<h2>" + esc(driver ? driver.name : "Driver") + "</h2>" +
        '<div class="sub">' +
          (driver && driver.driverNumber
            ? "Driver #" + esc(String(driver.driverNumber)) + " · jobs and tickets only"
            : "Accept dispatches and submit tickets for Office.") +
        "</div></div>";

      if (pending) {
        html +=
          '<div class="card pad outline-orange job-card">' +
            '<div class="badge c-orange">' + I.bell + " Dispatch needs your accept</div>" +
            '<div class="load">' + esc(pending.loadReference) + "</div>" +
            '<div class="cust">' + esc(pending.customerName) + "</div>" +
            '<div class="route">' + esc(pending.origin) + " → " + esc(pending.destination) + "</div>" +
            '<div class="unit">Unit ' + esc(pending.equipmentUnit.replace(/^Unit\s*/i, "")) + "</div>" +
            '<div class="btn-row">' +
              '<button type="button" class="btn btn-secondary" data-action="declineJob" data-id="' + esc(pending.id) + '">Decline</button>' +
              '<button type="button" class="btn btn-primary" data-action="acceptJob" data-id="' + esc(pending.id) + '">Accept job</button>' +
            "</div>" +
          "</div>";
      }

      if (active) {
        html +=
          '<div class="card pad job-card">' +
            '<div class="badge c-green">' + I.truck + " Job you’re on</div>" +
            '<div class="load">' + esc(active.loadReference) + "</div>" +
            '<div class="cust">' + esc(active.customerName) + "</div>" +
            '<div class="route">' + esc(active.origin) + " → " + esc(active.destination) + "</div>" +
            '<button type="button" class="btn btn-primary btn-full" data-action="startTicket" data-id="' + esc(active.id) + '">' +
              I.docPlus + " Start ticket</button>" +
          "</div>";
      } else if (!pending) {
        html +=
          '<div class="card empty mb-14">' + I.wheel +
            '<div class="t">No active job</div>' +
            '<div class="s">When you accept a dispatch, it shows here with a Start ticket button.</div>' +
          "</div>";
      }

      html +=
        sectionHead("Previous dispatches", "See all", "goDispatches") +
        '<div class="card mb-14">' +
          (previous.length
            ? previous.map(function (j) {
                return (
                  '<button type="button" class="list-row" data-action="goDispatches">' +
                    '<span class="main">' +
                      '<span class="top"><span class="name">' + esc(j.loadReference) + '</span><span class="status c-secondary">' + esc(STATUS_TITLE[j.status]) + "</span></span>" +
                      '<span class="line">' + esc(j.origin) + " → " + esc(j.destination) + "</span>" +
                    "</span>" +
                  "</button>"
                );
              }).join("")
            : '<div class="empty"><div class="s">No previous dispatches yet.</div></div>') +
        "</div>" +
        sectionHead("Quick actions") +
        '<div class="card">' +
          actionRow("My dispatches", "Accept jobs and history", I.list(true), "goDispatches") +
          (active
            ? actionRow("Start ticket", "For the job you’re on", I.docPlus, "startTicket:" + active.id)
            : "") +
          actionRow("Settings", "Account and app info", I.gear(true), "goSettings") +
        "</div>";

      return html;
    }

    function renderHome() {
      switch (session.role) {
        case "owner": return renderOwnerHome();
        case "office": return renderOfficeHome();
        case "dispatcher": return renderDispatcherHome();
        case "mechanic": return renderMechanicHome();
        case "driver": return renderDriverHome();
        default: return "";
      }
    }

    /* —— Tab screens —— */
    function renderDispatches() {
      if (session.role === "driver") {
        var mine = myDispatches();
        var pending = mine.filter(function (j) { return j.status === "sent"; });
        var active = mine.filter(function (j) { return j.status === "accepted"; });
        var done = mine.filter(function (j) {
          return j.status === "completed" || j.status === "declined";
        });

        return (
          (pending.length
            ? sectionHead("Needs accept") +
              '<div class="card mb-14">' + pending.map(function (j) { return dispatchPreviewRow(j, true); }).join("") + "</div>"
            : "") +
          (active.length
            ? sectionHead("Active") +
              '<div class="card mb-14">' + active.map(function (j) { return dispatchPreviewRow(j, true); }).join("") + "</div>"
            : "") +
          sectionHead("History") +
          '<div class="card">' +
            (done.length
              ? done.map(function (j) { return dispatchPreviewRow(j, true); }).join("")
              : '<div class="empty"><div class="s">No history yet.</div></div>') +
          "</div>"
        );
      }

      // Owner / dispatcher board list
      var pending = dispatchesPending();
      var active = dispatchesActive();
      var done = dispatchesCompleted();

      return (
        '<div class="card action-card mb-8">' +
          '<button type="button" class="btn-ghost" data-action="newDispatch">' +
            I.plus + " New dispatch</button>" +
        "</div>" +
        '<p class="group-footer" style="margin-top:0">Assign a load to a driver. They can accept it, then complete a ticket for Office.</p>' +
        sectionHead("Sent · awaiting driver") +
        '<div class="card mb-14">' +
          (pending.length
            ? pending.map(function (j) { return dispatchPreviewRow(j, true); }).join("")
            : '<div class="empty"><div class="s">None waiting.</div></div>') +
        "</div>" +
        sectionHead("Accepted") +
        '<div class="card mb-14">' +
          (active.length
            ? active.map(function (j) { return dispatchPreviewRow(j, true); }).join("")
            : '<div class="empty"><div class="s">None accepted right now.</div></div>') +
        "</div>" +
        sectionHead("Completed & declined") +
        '<div class="card">' +
          (done.length
            ? done.map(function (j) { return dispatchPreviewRow(j, true); }).join("")
            : '<div class="empty"><div class="s">No completed or declined jobs yet.</div></div>') +
        "</div>"
      );
    }

    function renderTickets() {
      var awaiting = ticketsAwaiting();
      var billed = ticketsBilled();

      function ticketRow(t) {
        return (
          '<button type="button" class="list-row" data-action="openTicket" data-id="' + esc(t.id) + '">' +
            '<span class="mark c-orange">' + I.doc(true) + "</span>" +
            '<span class="main">' +
              '<span class="top"><span class="name">' + esc(t.number) + '</span><span class="amount">' + money(t.rateAmount) + "</span></span>" +
              '<span class="line strong">' + esc(t.customerName) + "</span>" +
              '<span class="line">' + esc(t.driverName) + " · " + esc(t.loadReference) + "</span>" +
            "</span>" +
          "</button>"
        );
      }

      return (
        sectionHead("Awaiting bill") +
        '<div class="card mb-14">' +
          (awaiting.length ? awaiting.map(ticketRow).join("") : '<div class="empty"><div class="s">Nothing to bill.</div></div>') +
        "</div>" +
        sectionHead("Billed") +
        '<div class="card">' +
          (billed.length ? billed.map(ticketRow).join("") : '<div class="empty"><div class="s">No billed tickets yet.</div></div>') +
        "</div>"
      );
    }

    function renderEquipment() {
      var need = writeUpsNeedingShop();
      var resolved = writeUpsResolved();

      function wuRow(w) {
        var pColor =
          w.priority === "high" || w.priority === "outOfService" ? "var(--red)" :
          w.priority === "medium" ? "var(--orange)" : "var(--secondary)";
        return (
          '<button type="button" class="list-row" data-action="openWriteUp" data-id="' + esc(w.id) + '">' +
            '<span class="mark c-orange">' + I.wrench(true) + "</span>" +
            '<span class="main">' +
              '<span class="top"><span class="name">' + esc(w.title) + '</span><span class="status" style="color:' + pColor + '">' + esc(PRIORITY_TITLE[w.priority]) + "</span></span>" +
              '<span class="line">' + esc(w.equipmentUnit) + " · " + esc(w.driverName) + " · " + esc(WRITEUP_STATUS[w.status]) + "</span>" +
            "</span>" +
          "</button>"
        );
      }

      return (
        sectionHead("Open for shop") +
        '<div class="card mb-14">' +
          (need.length ? need.map(wuRow).join("") : '<div class="empty"><div class="s">No open write-ups.</div></div>') +
        "</div>" +
        sectionHead("Resolved") +
        '<div class="card">' +
          (resolved.length ? resolved.map(wuRow).join("") : '<div class="empty"><div class="s">None resolved yet.</div></div>') +
        "</div>"
      );
    }

    function roleTitle(role) {
      return ({ owner: "Owner", dispatcher: "Dispatcher", office: "Office", mechanic: "Mechanic", driver: "Driver" })[role] || role;
    }

    function renderTeam() {
      var manage = canManageUsers();
      var members = session.teamMembers.slice().sort(function (a, b) {
        var order = { owner: 0, dispatcher: 1, office: 2, mechanic: 3, driver: 4 };
        return (order[a.role] || 9) - (order[b.role] || 9);
      });

      var rows = members.map(function (m) {
        var canRemove = manage && m.role !== "owner";
        return (
          '<div class="list-row" style="cursor:default">' +
            '<span class="team-avatar role-' + esc(m.role) + '">' + esc(initials(m.name)) + "</span>" +
            '<span class="main">' +
              '<span class="top">' +
                '<span class="name">' + esc(m.name) + "</span>" +
                '<span class="team-role-pill">' + esc(roleTitle(m.role)) + "</span>" +
              "</span>" +
              '<span class="line">@' + esc(m.username) +
                (m.driverNumber ? " · Driver #" + m.driverNumber : "") +
              "</span>" +
            "</span>" +
            (canRemove
              ? '<button type="button" class="btn-remove-user" data-action="removeUser" data-id="' + esc(m.id) + '" aria-label="Remove ' + esc(m.name) + '">Remove</button>'
              : "") +
          "</div>"
        );
      }).join("");

      return (
        '<div class="group-label">Team · ' + esc(session.companyName) + "</div>" +
        '<div class="card mb-8">' + rows + "</div>" +
        '<p class="group-footer">Owner sets each user’s name, username, and password. Accounts stay inside this company only.</p>' +
        (manage
          ? '<div class="card action-card mb-8">' +
              '<button type="button" class="btn-ghost" data-action="addUser">' +
                '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M15 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm-9-2V8H4v2H2v2h2v2h2v-2h2v-2H6zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>' +
                "Add user" +

    function collectTicketCharges() {
      var charges = [];
      var root = document.getElementById("ticket-charges");
      if (!root) return charges;
      root.querySelectorAll(".charge-item").forEach(function (item) {
        var toggle = item.querySelector(".toggle");
        var amt = item.querySelector(".charge-amt");
        var labelEl = item.querySelector(".field-row .k");
        if (!toggle || !toggle.classList.contains("is-on") || !amt) return;
        var amount = parseMoneyInput(amt.value);
        if (amount <= 0) return;
        charges.push({
          label: labelEl ? labelEl.textContent : "Charge",
          amount: amount
        });
      });
      return charges;
    }

        driverNumber: driver && driver.driverNumber ? String(driver.driverNumber) : "",
        driverUsername: driver ? driver.username : "",

              '<canvas id="sig-canvas" width="560" height="320" aria-label="Signature pad"></canvas>' +
              '<div class="sig-canvas-hint">Sign here</div>' +
            "</div>" +
            '<div class="sig-pad-tools">' +
              '<button type="button" class="btn btn-secondary" data-action="clearSignature">Clear</button>' +
              '<button type="button" class="btn btn-primary" data-action="saveSignature" id="sig-save-btn" disabled>Done</button>' +
            "</div>" +
          "</div>" +
          '<button type="button" class="btn btn-secondary btn-full" data-action="cancelSignature">Cancel</button>' +
          '<p class="group-footer">Signature is captured on this device and attached to the ticket before Office receives it.</p>' +

    var ticketDraft = null;
    var sigPad = null;

    function destroySigPad() {
      if (sigPad && sigPad.destroy) sigPad.destroy();
      sigPad = null;
    }

    function initSigPad() {
      destroySigPad();
      var canvas = document.getElementById("sig-canvas");
      var wrap = document.getElementById("sig-canvas-wrap");
      var saveBtn = document.getElementById("sig-save-btn");
      if (!canvas || !wrap) return;

      var ctx = canvas.getContext("2d");
      var drawing = false;
      var hasInk = false;
      var lastX = 0;
      var lastY = 0;

      function resize() {
        var rect = wrap.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.floor(rect.width));
        var h = 160;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1c1c1e";
        ctx.lineWidth = 2.4;
        // restore blank after resize
        hasInk = false;
        wrap.classList.remove("has-ink");
        if (saveBtn) saveBtn.disabled = true;
      }

      function pos(e) {
        var rect = canvas.getBoundingClientRect();
        var t = e.touches && e.touches[0] ? e.touches[0] : e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e;
        return {
          x: t.clientX - rect.left,
          y: t.clientY - rect.top
        };
      }

      function start(e) {
        e.preventDefault();
        drawing = true;
        var p = pos(e);
        lastX = p.x;
        lastY = p.y;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
      }

      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        var p = pos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x;
        lastY = p.y;
        if (!hasInk) {
          hasInk = true;
          wrap.classList.add("has-ink");
          if (saveBtn) saveBtn.disabled = false;
        }
      }

      function end(e) {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
      }

      function clear() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasInk = false;
        wrap.classList.remove("has-ink");
        if (saveBtn) saveBtn.disabled = true;
      }

      function exportDataUrl() {
        if (!hasInk) return null;
        // Export at display size on white background
        var out = document.createElement("canvas");
        var rect = canvas.getBoundingClientRect();
        out.width = Math.max(1, Math.floor(rect.width));
        out.height = 160;
        var octx = out.getContext("2d");
        octx.fillStyle = "#ffffff";
        octx.fillRect(0, 0, out.width, out.height);
        octx.drawImage(canvas, 0, 0, out.width, out.height);
        return out.toDataURL("image/png");
      }

      resize();
      canvas.addEventListener("mousedown", start);
      canvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", end);
      canvas.addEventListener("touchstart", start, { passive: false });
      canvas.addEventListener("touchmove", move, { passive: false });
      canvas.addEventListener("touchend", end, { passive: false });
      canvas.addEventListener("touchcancel", end, { passive: false });

      sigPad = {
        clear: clear,
        exportDataUrl: exportDataUrl,
        hasInk: function () { return hasInk; },
        destroy: function () {
          canvas.removeEventListener("mousedown", start);
          canvas.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", end);
          canvas.removeEventListener("touchstart", start);
          canvas.removeEventListener("touchmove", move);
          canvas.removeEventListener("touchend", end);
          canvas.removeEventListener("touchcancel", end);
        }
      };
    }

    function chargeToggle(label, id, on, amount) {
      var amt = amount == null ? "" : String(amount);
      return (
        '<div class="charge-item" data-charge="' + esc(id) + '">' +
          '<div class="field-row">' +
            '<span class="k">' + esc(label) + "</span>" +
            '<button type="button" class="toggle' + (on ? " is-on" : "") + '" data-action="toggleCharge" data-target="' + esc(id) + '" id="' + esc(id) + '" aria-label="Toggle ' + esc(label) + '"></button>' +
          "</div>" +
          '<div class="field-row charge-amt-row"' + (on ? "" : " hidden") + ' id="' + esc(id) + '-row">' +
            '<span class="k">Amount</span>' +
            '<input class="field-input charge-amt" id="' + esc(id) + '-amt" inputmode="decimal" placeholder="0.00" value="' + esc(amt) + '" aria-label="' + esc(label) + ' amount" />' +
          "</div>" +
        "</div>"
      );
    }

    function parseMoneyInput(str) {
      var n = parseFloat(String(str || "").replace(/[^0-9.]/g, ""));
      return isFinite(n) ? n : 0;
    }

    function formatMoneyInput(n) {
      return (Math.round(n * 100) / 100).toFixed(2);
    }

    function updateTicketTotal() {
      var totalEl = document.getElementById("tk-total");
      var charges = document.getElementById("ticket-charges");
      if (!totalEl || !charges) return 0;

      var sum = 0;
      charges.querySelectorAll(".charge-item").forEach(function (item) {
        var toggle = item.querySelector(".toggle");
        var amt = item.querySelector(".charge-amt");
        if (toggle && toggle.classList.contains("is-on") && amt) {
          sum += parseMoneyInput(amt.value);
        }
      });
      totalEl.value = formatMoneyInput(sum);
      return sum;
    }

    /* —— Main render —— */
    function renderTabBar() {
      var tabs = tabsForRole();
      var bar = document.getElementById("tabbar");
      if (nav.sheet) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      bar.innerHTML = tabs.map(function (t) {
        var active = nav.tab === t.id;
        var iconFn = I[t.icon] || I.house;
        var icon = typeof iconFn === "function" ? iconFn(active) : iconFn;
        return (
          '<button type="button" class="tab' + (active ? " is-active" : "") + '" data-tab="' + esc(t.id) + '" aria-label="' + esc(t.title) + '">' +
            icon + "<span>" + esc(t.title) + "</span>" +
          "</button>"
        );
      }).join("");
    }

    function renderChips() {
      var el = document.getElementById("role-chips");
      el.innerHTML = ROLES.map(function (r) {
        return (
          '<button type="button" class="role-chip' + (session.role === r.id ? " is-active" : "") + '" data-role="' + esc(r.id) + '">' +
            esc(r.title) +
          "</button>"
        );
      }).join("");
    }

    function renderTopBar() {
      var bar = document.getElementById("top-bar");
      var title = document.getElementById("top-title");
      title.textContent = titleForScreen();
      var hasBack = nav.screen !== "home" && !nav.sheet;
      bar.classList.toggle("has-back", hasBack);
      bar.classList.toggle("has-right", false);
      document.getElementById("nav-back").textContent = "Back";
    }

    function renderContent() {
      var root = document.getElementById("content");
      var html = "";

      if (nav.screen === "dispatchDetail") {
        html = renderDispatchDetail(nav.detailId);
      } else if (nav.screen === "ticketDetail") {
        html = renderTicketDetail(nav.detailId);
      } else if (nav.screen === "writeupDetail") {
        html = renderWriteUpDetail(nav.detailId);
      } else {
        switch (nav.tab) {
          case "home": html = renderHome(); break;
          case "dispatches": html = renderDispatches(); break;
          case "tickets": html = renderTickets(); break;
          case "equipment": html = renderEquipment(); break;
          case "team": html = renderTeam(); break;
          case "settings": html = renderSettings(); break;
          default: html = renderHome();
        }
      }

      root.innerHTML = html;
      root.scrollTop = 0;
    }

    function renderSheet() {
      var sheet = document.getElementById("sheet");
      if (!nav.sheet) {
        sheet.hidden = true;
        sheet.innerHTML = "";
        return;
      }
      sheet.hidden = false;
      if (nav.sheet === "newDispatch") {
        sheet.innerHTML = renderNewDispatchSheet();
      } else if (nav.sheet === "ticket") {
        sheet.innerHTML = renderTicketSheet(nav.detailId);
      } else if (nav.sheet === "addUser") {
        sheet.innerHTML = renderAddUserSheet();
      }
    }

    function renderAll() {
      renderChips();
      renderTopBar();
      renderContent();
      renderTabBar();
      renderSheet();
    }

    /* —— Navigation actions —— */
    function goTab(tab) {
      nav.tab = tab;
      nav.screen = "home";
      nav.detailId = null;
      nav.sheet = null;
      renderAll();
    }

    function setRole(role) {
      session.role = role;
      if (role === "driver" && !currentDriver()) {
        session.signedInDriverUsername = drivers()[0] ? drivers()[0].username : "tbrooks";
      }
      nav.tab = "home";
      nav.screen = "home";
      nav.detailId = null;
      nav.sheet = null;
      renderAll();
      toast("Signed in as " + ({ owner: "Owner", office: "Office", dispatcher: "Dispatcher", mechanic: "Mechanic", driver: "Driver" })[role]);
    }

    function findDispatch(id) {
      return session.dispatches.find(function (d) { return d.id === id; });
    }

    function handleAction(action, el) {
      if (!action) return;

      if (action === "goHome") return goTab("home");
      if (action === "goDispatches") return goTab("dispatches");
      if (action === "goTickets") return goTab("tickets");
      if (action === "goEquipment") return goTab("equipment");
      if (action === "goTeam") return goTab("team");
      if (action === "goSettings") return goTab("settings");

      if (action === "setRole") {
        setRole(el.getAttribute("data-role"));
        return;
      }

      if (action === "toggleDelegate") {
        session.delegateUserManagementToDispatcher = !session.delegateUserManagementToDispatcher;
        renderAll();
        toast(session.delegateUserManagementToDispatcher ? "Delegation on" : "Delegation off");
        return;
      }

      if (action === "openDispatch") {
        nav.screen = "dispatchDetail";
        nav.detailId = el.getAttribute("data-id");
        renderAll();
        return;
      }

      if (action === "openTicket") {
        nav.screen = "ticketDetail";
        nav.detailId = el.getAttribute("data-id");
        renderAll();
        return;
      }

      if (action === "openWriteUp") {
        nav.screen = "writeupDetail";
        nav.detailId = el.getAttribute("data-id");
        renderAll();
        return;
      }

      if (action === "acceptJob") {
        var job = findDispatch(el.getAttribute("data-id"));
        if (job && job.status === "sent") {
          job.status = "accepted";
          toast("Job accepted");
          renderAll();
        }
        return;
      }

      if (action === "declineJob") {
        var jobD = findDispatch(el.getAttribute("data-id"));
        if (jobD && jobD.status === "sent") {
          jobD.status = "declined";
          toast("Job declined");
          renderAll();
        }
        return;
      }

      if (action.indexOf("startTicket") === 0) {
        var tid = action.indexOf(":") >= 0 ? action.split(":")[1] : el.getAttribute("data-id");
        nav.sheet = "ticket";
        nav.detailId = tid;
        renderAll();
        return;
      }

      if (action === "newDispatch") {
        nav.sheet = "newDispatch";
        renderAll();
        return;
      }

      if (action === "addUser") {
        if (!canManageUsers()) {
          toast("Not allowed for this role");
          return;
        }
        nav.sheet = "addUser";
        renderAll();
        return;
      }

      if (action === "submitAddUser") {
        if (!canManageUsers()) return;
        var nameEl = document.getElementById("au-name");
        var userEl = document.getElementById("au-username");
        var passEl = document.getElementById("au-pass");
        var pass2El = document.getElementById("au-pass2");
        var roleEl = document.getElementById("au-role");
        var name = (nameEl && nameEl.value || "").trim();
        var username = (userEl && userEl.value || "").trim().toLowerCase().replace(/\s+/g, "");
        var pass = passEl ? passEl.value : "";
        var pass2 = pass2El ? pass2El.value : "";
        var role = roleEl ? roleEl.value : "driver";

        if (!name) { toast("Enter a full name"); return; }
        if (!username) { toast("Enter a username"); return; }
        if (session.teamMembers.some(function (m) { return m.username.toLowerCase() === username; })) {
          toast("Username already taken");
          return;
        }
        if (!pass) { toast("Enter a password"); return; }
        if (pass !== pass2) { toast("Passwords do not match"); return; }
        if (["dispatcher", "office", "mechanic", "driver"].indexOf(role) < 0) {
          role = "driver";
        }

        var driverNumber = null;
        if (role === "driver") {
          var existing = session.teamMembers.map(function (m) { return m.driverNumber || 0; });
          driverNumber = (existing.length ? Math.max.apply(null, existing) : 1431) + 1;
        }

        session.teamMembers.push({
          id: uid(),
          name: name,
          username: username,
          role: role,
          driverNumber: driverNumber,
          ticketSequence: 0
        });
        nav.sheet = null;
        nav.tab = "team";
        nav.screen = "home";
        renderAll();
        toast(name + " added as " + roleTitle(role));
        return;
      }

      if (action === "removeUser") {
        if (!canManageUsers()) return;
        var rid = el.getAttribute("data-id");
        var member = session.teamMembers.find(function (m) { return m.id === rid; });
        if (!member || member.role === "owner") {
          toast("Can’t remove the owner");
          return;
        }
        session.teamMembers = session.teamMembers.filter(function (m) { return m.id !== rid; });
        renderAll();
        toast(member.name + " removed");
        return;
      }

      if (action === "closeSheet") {
        destroySigPad();
        ticketDraft = null;
        nav.sheet = null;
        renderAll();
        return;
      }

      if (action === "sendDispatch") {
        var sel = document.getElementById("nd-driver");
        var driverUser = sel ? sel.value : "";
        var member = session.teamMembers.find(function (m) { return m.username === driverUser; });
        var load = (document.getElementById("nd-load") || {}).value || nextLoadRef();
        var customer = (document.getElementById("nd-customer") || {}).value || "Customer";
        var origin = (document.getElementById("nd-origin") || {}).value || "Origin";
        var dest = (document.getElementById("nd-dest") || {}).value || "Destination";
        var unit = (document.getElementById("nd-unit") || {}).value || "Unit 1";
        var notes = (document.getElementById("nd-notes") || {}).value || "";

        session.dispatches.unshift({
          id: uid(),
          loadReference: load,
          customerName: customer,
          origin: origin,
          destination: dest,
          driverName: member ? member.name : "Driver",
          driverUsername: driverUser,
          equipmentUnit: unit,
          notes: notes,
          status: "sent",
          sentAt: Date.now()
        });
        nav.sheet = null;
        nav.tab = "dispatches";
        nav.screen = "home";
        renderAll();
        toast("Dispatch sent");
        return;
      }

      if (action === "generateTicket") {
        var genJobId = el.getAttribute("data-id");
        if (!findDispatch(genJobId) || !currentDriver()) return;
        updateTicketTotal();
        var draft = collectTicketDraft(
          genJobId,
          el.getAttribute("data-number") || "",
          el.getAttribute("data-date") || ""
        );
        if (!draft.charges.length && draft.total <= 0) {
          toast("Add at least one charge amount");
          return;
        }
        draft.customerSignature = null;
        draft.signedAtLabel = null;
        showTicketPreview(draft);
        toast("Ticket generated");
        return;
      }

      if (action === "editTicket") {
        showTicketForm();
        return;
      }

      if (action === "openCustomerSign") {
        if (!ticketDraft) {
          toast("Generate the ticket first");
          return;
        }
        showCustomerSignPad();
        return;
      }

      if (action === "clearSignature") {
        if (sigPad) sigPad.clear();
        return;
      }

      if (action === "cancelSignature") {
        if (ticketDraft) showTicketPreview(ticketDraft);
        return;
      }

      if (action === "saveSignature") {
        if (!ticketDraft || !sigPad) return;
        var dataUrl = sigPad.exportDataUrl();
        if (!dataUrl) {
          toast("Please sign before continuing");
          return;
        }
        var now = new Date();
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        ticketDraft.customerSignature = dataUrl;
        ticketDraft.signedAtLabel =
          months[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear() +
          " · " + now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
        destroySigPad();
        showTicketPreview(ticketDraft);
        toast("Customer signature captured");
        return;
      }

      if (action === "submitTicket") {
        var draftT = ticketDraft;
        if (!draftT) {
          toast("Generate the ticket first");
          return;
        }
        if (!draftT.customerSignature) {
          toast("Customer must sign first");
          showCustomerSignPad();
          return;
        }
        var jobT = findDispatch(draftT.jobId);
        var driverT = currentDriver();
        if (!jobT || !driverT) return;

        driverT.ticketSequence = (driverT.ticketSequence || 0) + 1;

        session.tickets.unshift({
          id: uid(),
          number: draftT.number,
          customerName: draftT.customerName || jobT.customerName,
          loadReference: draftT.loadReference || jobT.loadReference,
          origin: draftT.origin || jobT.origin,
          destination: draftT.destination || jobT.destination,
          driverName: driverT.name,
          driverUsername: driverT.username,
          equipmentUnit: draftT.equipmentUnit || jobT.equipmentUnit,
          rateAmount: draftT.total || 0,
          status: "submitted",
          notes: draftT.hauled || "",
          charges: draftT.charges || [],
          customerSignature: draftT.customerSignature,
          signedAtLabel: draftT.signedAtLabel || ""
        });

        jobT.status = "completed";
        destroySigPad();
        ticketDraft = null;
        nav.sheet = null;
        nav.tab = "home";
        nav.screen = "home";
        renderAll();
        toast("Ticket submitted to Office");
        return;
      }

      if (action === "billTicket") {
        var ticket = session.tickets.find(function (t) { return t.id === el.getAttribute("data-id"); });
        if (ticket && ticket.status === "submitted") {
          ticket.status = "billed";
          toast("Ticket billed");
          renderAll();
        }
        return;
      }

      if (action === "wuStatus") {
        var wu = session.writeUps.find(function (w) { return w.id === el.getAttribute("data-id"); });
        if (wu) {
          wu.status = el.getAttribute("data-status");
          toast("Write-up updated");
          renderAll();
        }
        return;
      }

      if (action === "toggleCharge") {
        el.classList.toggle("is-on");
        var target = el.getAttribute("data-target");
        var row = document.getElementById(target + "-row");
        var amt = document.getElementById(target + "-amt");
        var isOn = el.classList.contains("is-on");
        if (row) {
          if (isOn) row.removeAttribute("hidden");
          else row.setAttribute("hidden", "");
        }
        if (isOn && amt) {
          if (!amt.value) amt.placeholder = "0.00";
          setTimeout(function () {
            amt.focus();
            amt.select();
          }, 0);
        }
        updateTicketTotal();
        return;
      }

      if (action === "reset") {
        session = makeSamples();
        session.role = session.role;
        nav = { tab: "home", screen: "home", detailId: null, sheet: null };
        // Keep current role after reset? User might want full reset - reset to owner
        session = makeSamples();
        nav = { tab: "home", screen: "home", detailId: null, sheet: null };
        renderAll();
        toast("Demo data reset");
        return;
      }
    }

    /* —— Events —— */
    document.getElementById("content").addEventListener("click", function (e) {
      var t = e.target.closest("[data-action]");
      if (!t) return;
      e.preventDefault();
      handleAction(t.getAttribute("data-action"), t);
    });

    document.getElementById("tabbar").addEventListener("click", function (e) {
      var t = e.target.closest("[data-tab]");

    document.getElementById("nav-back").addEventListener("click", function () {

        nav.sheet = null;
        renderAll();
        return;
      }
      nav.screen = "home";
      nav.detailId = null;
      renderAll();
    });

    document.getElementById("sheet").addEventListener("click", function (e) {
      var t = e.target.closest("[data-action]");
      if (!t) return;
      e.preventDefault();
      handleAction(t.getAttribute("data-action"), t);
    });

    document.getElementById("sheet").addEventListener("input", function (e) {
      if (e.target && e.target.classList && e.target.classList.contains("charge-amt")) {
        updateTicketTotal();
      }
    });

    document.getElementById("sheet").addEventListener("change", function (e) {
      if (e.target && e.target.classList && e.target.classList.contains("charge-amt")) {
        var n = parseMoneyInput(e.target.value);
        if (e.target.value !== "") e.target.value = formatMoneyInput(n);
        updateTicketTotal();
      }
    });

    document.getElementById("refresh-btn").addEventListener("click", function () {
      var keepRole = session.role;
      session = makeSamples();
      session.role = keepRole;
      nav = { tab: "home", screen: "home", detailId: null, sheet: null };
      renderAll();
      toast("Demo reset");
    });

    // Clock
    function tickClock() {
      var d = new Date();
      var h = d.getHours();
      var m = d.getMinutes();
      var label = h + ":" + String(m).padStart(2, "0");
      // Use 9:41 style often — keep live clock for realism
      document.getElementById("clock").textContent = label;
    }
    tickClock();
    setInterval(tickClock, 30000);

    // Start role from query (?role=owner|office|dispatcher|mechanic|driver) or dispatcher default
    (function initRole() {
      var params = new URLSearchParams(window.location.search);
      var role = (params.get("role") || "dispatcher").toLowerCase();
      var allowed = { owner: 1, office: 1, dispatcher: 1, mechanic: 1, driver: 1 };
      // Map website tab name "dispatch" → app role
      if (role === "dispatch") role = "dispatcher";
      session.role = allowed[role] ? role : "dispatcher";
    })();
    renderAll();
  })();
  </script>
</body>
</html>
